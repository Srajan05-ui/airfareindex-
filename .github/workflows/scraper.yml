name: Airfare Scraper Pipeline

on:
  schedule:
    # Runs at 00:30 and 12:30 UTC (06:00 and 18:00 IST) every day
    - cron: '30 0,12 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    # We need permission to push commits to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_deploy.txt
          pip install schedule playwright bs4 lxml  # Scraper specific requirements if not in deploy

      - name: Install browser for scraping
        run: python -m playwright install chromium

      - name: Run data collection pipeline
        run: python run_pipeline.py

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add airfare.db
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: update airfare data [skip ci]" && git push)
